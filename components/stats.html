<!--
    ARQUIVO: components/stats.html
    DESCRIÇÃO: Componente da seção de estatísticas/números da landing page.

    Este arquivo é carregado dinamicamente pelo JavaScript (main.js) e injetado
    no elemento <div id="stats-placeholder"> do index.html.

    ESTRUTURA:
      Três itens de estatística, cada um com ícone, valor e rótulo:
        1. +200 pessoas atendidas
        2. 99% de satisfação
        3. Modalidade flexível

    ANIMAÇÕES:
      - Classe "reveal": ativada pelo IntersectionObserver em main.js
      - transition-delay: escalonamento das animações de entrada
      - data-count="200": atributo usado pelo JS para animar a contagem numérica
-->

<!-- Seção de estatísticas: aria-label="Números" para acessibilidade -->
<section class="stats" aria-label="Números">
  <div class="container">
    <div class="stats_inner">

      <!-- ── Estatística 1: Pessoas Atendidas ── -->
      <!-- Classe "reveal": animado ao entrar na viewport -->
      <div class="stats_item reveal">
        <div class="stats_icon">
          <!-- Ícone de pessoa/usuário em SVG -->
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="stats_text">
          <!-- data-count="200": valor alvo para a animação de contagem (main.js) -->
          <div class="stats_value" data-count="200">+200</div>
          <div class="stats_label">pessoas atendidas</div>
        </div>
      </div>

      <!-- ── Estatística 2: Satisfação ── -->
      <!-- transition-delay:.1s: segunda animação da sequência -->
      <div class="stats_item reveal" style="transition-delay:.1s">
        <div class="stats_icon">
          <!-- Ícone de rosto sorridente em SVG -->
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></svg>
        </div>
        <div class="stats_text">
          <!-- Sem data-count: valor estático (percentual, não numérico) -->
          <div class="stats_value">99%</div>
          <div class="stats_label">de satisfação</div>
        </div>
      </div>

      <!-- ── Estatística 3: Modalidade Flexível ── -->
      <!-- transition-delay:.2s: terceira animação da sequência -->
      <div class="stats_item reveal" style="transition-delay:.2s">
        <div class="stats_icon">
          <!-- Ícone de monitor/tela em SVG (representa atendimento online) -->
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="12" x="3" y="4" rx="2" ry="2"/><line x1="2" x2="22" y1="20" y2="20"/><line x1="5" x2="19" y1="16" y2="16"/></svg>
        </div>
        <div class="stats_text">
          <!-- Valor textual (não numérico, sem animação de contagem) -->
          <div class="stats_value">Modalidade</div>
          <div class="stats_label">flexível</div>
        </div>
      </div>

    </div>
  </div>
</section>
